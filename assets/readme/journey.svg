<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="t d">
  <title id="t">From a foggy idea to a working app</title>
  <desc id="d">A foggy idea is charted into a map of tickets on GitHub Issues, then worked one ticket per session until the app works.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .step { font-size: 12px; font-weight: 700; letter-spacing: .14em; fill: #4fae7c; }
      .h { font-size: 19px; font-weight: 700; fill: #f2efe8; }
      .sub { font-size: 13px; fill: #9fb0a6; }
      .dim { fill: #7d8f84; }
      .row { font-size: 13px; fill: #f2efe8; }
      .tag { font-size: 11px; font-weight: 600; }
      .arrow { font-size: 12px; fill: #9fb0a6; font-style: italic; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1714"/>
      <stop offset="1" stop-color="#0c1210"/>
    </linearGradient>
    <radialGradient id="fog" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9fb0a6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9fb0a6" stop-opacity="0"/>
    </radialGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8613c"/>
    </marker>
  </defs>

  <rect width="960" height="380" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="959" height="379" rx="18" fill="none" stroke="#24322c"/>

  <!-- 01 · l'idea nella nebbia -->
  <g class="sans">
    <text x="40" y="52" class="step">01 · THE IDEA</text>
    <text x="40" y="80" class="h">Big and foggy</text>
    <text x="40" y="102" class="sub">too much for one session</text>
  </g>
  <ellipse cx="150" cy="232" rx="120" ry="80" fill="url(#fog)"/>
  <ellipse cx="110" cy="250" rx="80" ry="50" fill="url(#fog)"/>
  <ellipse cx="200" cy="215" rx="70" ry="45" fill="url(#fog)"/>
  <g class="sans" text-anchor="middle">
    <text x="150" y="205" class="row" font-size="14">a booking app</text>
    <text x="150" y="223" class="row" font-size="14">for my climbing gym</text>
    <text x="92" y="262" class="dim" font-size="22">?</text>
    <text x="150" y="282" class="dim" font-size="17">payments?</text>
    <text x="214" y="258" class="dim" font-size="22">?</text>
    <text x="118" y="304" class="dim" font-size="13">calendar sync?</text>
  </g>

  <!-- freccia: chart -->
  <path d="M286 232 C 306 232, 316 232, 334 232" stroke="#e8613c" stroke-width="2.5" fill="none" marker-end="url(#head)"/>
  <text x="310" y="218" class="sans arrow" text-anchor="middle">chart</text>

  <!-- 02 · la mappa su GitHub Issues -->
  <g class="sans">
    <text x="352" y="52" class="step">02 · THE MAP</text>
    <text x="352" y="80" class="h">Tickets on GitHub Issues</text>
    <text x="352" y="102" class="sub">decide first, then build</text>
  </g>
  <rect x="352" y="124" width="276" height="220" rx="12" fill="#131b18" stroke="#24322c"/>
  <g class="sans">
    <text x="370" y="152" class="row" font-weight="700">◆ booking map</text>
    <text x="610" y="152" class="sub" text-anchor="end" font-size="12">7 / 18 resolved</text>
    <rect x="370" y="162" width="240" height="5" rx="2.5" fill="#1c2823"/>
    <rect x="370" y="162" width="93" height="5" rx="2.5" fill="#3c7a5a"/>

    <!-- righe ticket -->
    <rect x="370" y="180" width="240" height="30" rx="7" fill="#172420"/>
    <rect x="378" y="188" width="60" height="15" rx="7.5" fill="#7c5cff" fill-opacity=".22"/>
    <text x="408" y="199" class="tag" fill="#b3a1ff" text-anchor="middle">decision</text>
    <text x="446" y="200" class="row" font-size="12.5">Payment provider</text>
    <text x="600" y="200" fill="#4fae7c" text-anchor="end" font-size="13">✓</text>

    <rect x="370" y="216" width="240" height="30" rx="7" fill="#172420"/>
    <rect x="378" y="224" width="60" height="15" rx="7.5" fill="#3b6ef5" fill-opacity=".22"/>
    <text x="408" y="235" class="tag" fill="#8fb0ff" text-anchor="middle">research</text>
    <text x="446" y="236" class="row" font-size="12.5">Calendar API limits</text>
    <text x="600" y="236" fill="#4fae7c" text-anchor="end" font-size="13">✓</text>

    <rect x="370" y="252" width="240" height="30" rx="7" fill="#172420" stroke="#e8613c" stroke-opacity=".7"/>
    <rect x="378" y="260" width="60" height="15" rx="7.5" fill="#3c7a5a" fill-opacity=".35"/>
    <text x="408" y="271" class="tag" fill="#7fd3a4" text-anchor="middle">build</text>
    <text x="446" y="272" class="row" font-size="12.5">Booking page</text>
    <text x="600" y="272" fill="#f3844f" text-anchor="end" font-size="11" font-weight="600">frontier</text>

    <rect x="370" y="288" width="240" height="30" rx="7" fill="#172420" stroke="#e8613c" stroke-opacity=".7"/>
    <rect x="378" y="296" width="60" height="15" rx="7.5" fill="#e8613c" fill-opacity=".22"/>
    <text x="408" y="307" class="tag" fill="#f3a07f" text-anchor="middle">bug</text>
    <text x="446" y="308" class="row" font-size="12.5">Double booking</text>
    <text x="600" y="308" fill="#f3844f" text-anchor="end" font-size="11" font-weight="600">frontier</text>

    <text x="370" y="335" class="dim" font-size="12">☁ fog: notifications, waitlist…</text>
  </g>

  <!-- freccia: work -->
  <path d="M638 232 C 658 232, 668 232, 686 232" stroke="#e8613c" stroke-width="2.5" fill="none" marker-end="url(#head)"/>
  <text x="662" y="218" class="sans arrow" text-anchor="middle">work</text>

  <!-- 03 · l'app funzionante -->
  <g class="sans">
    <text x="704" y="52" class="step">03 · THE RESULT</text>
    <text x="704" y="80" class="h">A working app</text>
    <text x="704" y="102" class="sub">one ticket per session</text>
  </g>
  <g class="sans">
    <rect x="704" y="124" width="216" height="220" rx="12" fill="#131b18" stroke="#24322c"/>
    <circle cx="812" cy="184" r="30" fill="#3c7a5a" fill-opacity=".25" stroke="#4fae7c" stroke-width="2"/>
    <path d="M798 184 l10 10 l18 -20" stroke="#4fae7c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="812" y="240" class="row" text-anchor="middle" font-weight="700">destination reached</text>
    <text x="722" y="270" class="mono" font-size="11.5" fill="#9fb0a6">feat: booking page</text>
    <text x="722" y="289" class="mono" font-size="11.5" fill="#9fb0a6">fix: double booking</text>
    <text x="722" y="308" class="mono" font-size="11.5" fill="#9fb0a6">test: calendar sync</text>
    <text x="722" y="330" class="dim" font-size="11.5">atomic commits · Refs: #ticket</text>
  </g>
</svg>
