# Temporary acceptance workflow for the capture Action (#341). Removed after the run.
name: capture-action-uat
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - id: cap
        uses: ToRvaLDz/trailhead/actions/capture@main
        with:
          type: bug
          title: 'UAT: capture Action under GITHUB_TOKEN (#341)'
          body: |
            Acceptance run of the capture Action for ticket #341.
            Safe to close.
          dedupe-key: uat-capture-action-341
      - run: echo "status=${{ steps.cap.outputs.status }} issue=${{ steps.cap.outputs.issue }} url=${{ steps.cap.outputs.url }}"
