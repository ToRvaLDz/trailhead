name: Publish to npm

# Pubblica il pacchetto su npm quando una GitHub Release viene pubblicata
# (o manualmente via "Run workflow"). Usa Trusted Publishing (OIDC): nessun
# token npm da salvare come secret, l'autenticazione avviene via OIDC a runtime.
# Prerequisito una-tantum: configurare questo repo + workflow come "trusted
# publisher" del pacchetto su npmjs.com (Package settings -> Trusted Publisher).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # richiesto da Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released tag (or the current ref on manual run)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node + npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        # Pinned to 11.x: npm@latest (12.x) requires Node >= 22.22, which the
        # runner may not have; npm@11 supports Trusted Publishing and runs here.
        run: npm install -g npm@11

      - name: Verify package.json version matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match release tag ($TAG). Bump the version, then re-cut the release."
            exit 1
          fi
          echo "Publishing @marcomigozzi/trailhead@$PKG"

      - name: Skip if this version is already on npm
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER is already on npm; skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (OIDC, no token)
        if: steps.check.outputs.already == 'false'
        run: npm publish
