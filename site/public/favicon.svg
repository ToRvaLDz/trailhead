<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="trailhead">
  <!-- Brand favicon: a trail climbing from the trailhead (start) to the
       destination waypoint. Colours are the site brand tokens
       (site/src/styles/brand-tokens.css): green tile, cream path, orange
       accent destination. Scales cleanly down to 16px. -->
  <rect width="48" height="48" rx="11" fill="#3c7a5a"/>
  <path d="M14 39 C 14 29, 34 30, 33 20" fill="none" stroke="#f2efe8"
        stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="14" cy="39" r="3.4" fill="#f2efe8"/>
  <circle cx="33" cy="15" r="5.4" fill="#e8613c"/>
</svg>
